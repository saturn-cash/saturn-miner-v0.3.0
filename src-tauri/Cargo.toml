[package]
name = "saturn-miner"
version = "0.6.1"
description = "Saturn Miner: desktop miner and Bitaxe controller for Saturn Core"
edition = "2021"
rust-version = "1.77"

[lib]
name = "saturn_miner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
local-ip-address = "0.6"
sha2 = "0.10"
# in-app wallet: BIP39 recovery phrase, BIP84 keys, P2WPKH signing
bitcoin = { version = "0.32", features = ["rand-std"] }
bip39 = { version = "2", features = ["rand"] }

# the recovery phrase is kept in the OS keychain where there is one (Keychain on macOS, Credential
# Manager on Windows); Linux keeps it in a file only this user can read
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
